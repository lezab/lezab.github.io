<anInput>
	type = input
	display = A Simple Required Input
	width = 300
	required
</anInput>

<multiSelect>
	type = select
	display = A Multiple Select
	width = 250
	multi
	nb_lines = 5
	default_value = 0
	<options>
		type = constant
		values = 0/1/2/3/4
		displays = Black/Blue/White/Red/Green
	</options>
</multiSelect>

<multiline>
	type = input
	display = A Multiple Input
	multi
	width = 300
	required
</multiline>

<boxes>
	type = checkbox
	display = Checkboxes
	<options>
		type = constant
		values = 0/1/2/3/4
		displays = Black/Blue/White/Red/Green
	</options>
	required
	#disabled
</boxes>

<aComplexSample>
	type = complex
	display = A Combined Field
	multi
	<info>      							
		type = select	
		width = 250
		display = Information type
		<options>
			type = constant
			values = tel/level/comment
			displays = Phone number/Level/Comments
		</options>
		required
	</info>
	<isrequired>
		type = radio
		display = Required
		<options>
			type = constant
			values = 0/1
			displays = Yes/No
		</options>
		required
	</isrequired>
	<priority>
		type = number
		display = Priority
		min = 1
		width = 50
	</priority>
</aComplexSample>

<fieldset_1>
	hiddeable
	display = A Hiddeable Fieldset
	help = path/to/help_for_fieldset.txt
	<radioboxes>
		type = radio
		display = Radioboxes
		<options>
			type = constant
			values = 0/1/2/3/4
			displays = Black/Blue/White/Red/Green
		</options>
	</radioboxes>
	
	<afile>
		type = file
		display = A File
		width = 400
		help = path/to/help_for_file.txt
	</afile>

	<adatetime>
		type = datetime
		display = A Datetime
		format = Y-m-d H:i
		min = D
		max = Y+4
	</adatetime>
</fieldset_1>


<submit>
	display = Validate
</submit>
